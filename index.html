<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<style>
:root{--kraft:#c9a97c;--grain:.35;--ink:#2b2015;--btn:#2b2015;--btnink:#fbf3e3;--cream:#fffdf7;--tape:rgba(235,214,150,.8);--W:300px;--zc:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--kraft:#7d6342;--ink:#f4e9d3;--btn:#f4e9d3;--btnink:#2b2015}}
:root[data-theme="dark"]{--kraft:#7d6342;--ink:#f4e9d3;--btn:#f4e9d3;--btnink:#2b2015}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:var(--kraft) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.stage{position:absolute;inset:0;padding:40px 0 112px;display:flex;align-items:center;justify-content:center}
.book{position:relative;width:calc(var(--W)*2);height:calc(var(--W)*1.414);perspective:2200px;transition:transform .9s cubic-bezier(.5,0,.2,1)}
.book.closed{transform:scale(var(--zc)) translateX(-25%)}
.pg{position:absolute;top:0;width:50%;height:100%;background:var(--cream);box-shadow:0 8px 28px rgba(40,25,10,.35)}
.pg img{display:block;position:absolute;user-select:none;-webkit-user-drag:none}
.tape{position:absolute;width:26%;height:5%;background:var(--tape);box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:9;pointer-events:none}
/* cover */
.cover{left:50%;transform-origin:left center;z-index:4;cursor:pointer;transition:transform .45s ease-out .45s,visibility 0s .45s}
.open .cover{transform:rotateY(-90deg);visibility:hidden;transition:transform .45s ease-in,visibility 0s .45s;pointer-events:none}
.cover img,.right img.base{inset:0;width:100%;height:100%}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6%;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent);pointer-events:none}
/* left page: letter */
.left{left:0;transform-origin:right center;transform:rotateY(90deg);visibility:hidden;z-index:6;transition:transform .45s ease-in,visibility 0s .45s}
.open .left{transform:none;visibility:visible;transition:transform .45s ease-out .45s,visibility 0s .45s}
.left::after,.right::after{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none;z-index:8}
.left::after{right:0;background:linear-gradient(270deg,rgba(60,40,15,.28),transparent)}
.right::after{left:0;background:linear-gradient(90deg,rgba(60,40,15,.28),transparent)}
#env{inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#letter{left:12%;top:13%;width:64%;aspect-ratio:1414/1200;object-fit:cover;z-index:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .7s cubic-bezier(.5,0,.2,1),box-shadow .7s;transform-origin:center}
#letter.up{z-index:7;box-shadow:0 18px 50px rgba(30,15,0,.55)}
.scrim{position:absolute;left:-100vw;right:-100vw;top:-100vh;bottom:-100vh;background:rgba(40,25,10,.4);opacity:0;pointer-events:none;transition:opacity .5s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.tuck{position:absolute;left:5%;width:42%;top:55%;text-align:center;font-size:clamp(10px,1.6vw,14px);opacity:.7;z-index:3;pointer-events:none;color:#3a2f1f}
/* right page: cake */
.right{left:50%;z-index:1}
.fl{position:absolute;transform-origin:50% 100%;transition:opacity .35s,scale .35s;will-change:transform}
.fl img{position:static;width:100%;display:block;animation:flick 1.3s ease-in-out infinite alternate}
.fl:nth-child(odd) img{animation-duration:.9s}
@keyframes flick{from{transform:rotate(-2deg) scaleY(.96)}to{transform:rotate(2.5deg) scaleY(1.04)}}
.fl.out{opacity:0;scale:.3 .1}
.smoke{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;background:rgba(120,110,100,.55);filter:blur(5px);animation:rise 1.4s ease-out forwards;pointer-events:none}
@keyframes rise{to{transform:translate(20px,-90px) scale(3);opacity:0}}
.meter{position:absolute;left:10%;right:10%;bottom:2.5%;height:6px;border-radius:9px;background:rgba(43,32,21,.18);overflow:hidden;z-index:3}
.meter i{display:block;height:100%;width:0;background:#8d5bbd;transition:width .06s}
.wish{position:absolute;left:6%;right:6%;top:46%;text-align:center;font:700 clamp(18px,3.4vw,30px)/1.15 Georgia,serif;color:#5a2d82;opacity:0;transition:opacity .6s;pointer-events:none;z-index:4;text-shadow:0 0 6px var(--cream),0 0 12px var(--cream),0 0 18px var(--cream)}
.wish.show{opacity:1}
.conf{position:fixed;top:-20px;width:9px;height:14px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112dvh) rotate(720deg)}}
/* controls */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;z-index:20}
.bar button{font:600 15px Georgia,serif;padding:.65em 1.1em;border-radius:99px;border:2px solid var(--btn);background:var(--btn);color:var(--btnink);cursor:pointer;touch-action:manipulation;user-select:none}
.bar button.ghost{background:transparent;color:var(--ink)}
.bar button:focus-visible{outline:3px solid #8d5bbd;outline-offset:2px}
.note{flex-basis:100%;text-align:center;font-size:13px;min-height:1.2em}
.bar .o{display:none}.is-open .bar .o{display:inline-block}.is-open .bar .c{display:none}
.bar #relight{display:none}.bar.done #relight{display:inline-block}.bar.done #hold,.bar.done #micbtn{display:none}
/* phone: one page at a time, full width */
.bar .sg{display:none!important}
.single .stage{padding:24px 0 176px}
.single .book{width:var(--W)}
.single .book.closed{transform:none}
.single .pg{width:100%}
.single .cover,.single .right,.single .left{left:0}
.single .left{transform:none;transform-origin:center;opacity:0;transition:opacity .35s .3s,visibility 0s .5s}
.single .book.open .left{opacity:1;visibility:visible;transition:opacity .35s .3s,visibility 0s 0s}
.single .right{opacity:0;visibility:hidden;z-index:7;transition:opacity .4s,visibility 0s .4s}
.single .book.cake .right{opacity:1;visibility:visible;transition:opacity .4s,visibility 0s 0s}
.single .left::after,.single .right::after{display:none}
.single .wish{font-size:26px}
.single .tuck{font-size:13px;width:44%}
.single .bar{gap:6px}
.single .bar button{font-size:14px;padding:.6em 1em}
.single .bar #back{order:9}
.single.is-open .bar #nextbtn{display:inline-block!important}
.single.is-open.is-cake .bar #nextbtn{display:none!important}
.single.is-open.is-cake .bar #prevbtn{display:inline-block!important}
.single:not(.is-cake) .bar .mc{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>

  var $=function(i){return document.getElementById(i)};
  var book=$('book'),root=document.documentElement,isOpen=false;
  var letter=$('letter'),scrim=$('scrim'),left=$('left'),lifted=false;
  var flamesEl=$('flames'),lvl=$('lvl'),wish=$('wish'),bar=$('bar'),note=$('note');

  function size(){
    var vw=innerWidth,vh=innerHeight,single=vw<700,W;
    document.body.classList.toggle('single',single);
    if(single){W=Math.min(vw*.92,(vh-200)*.707);root.style.setProperty('--zc',1)}
    else{W=Math.min(vw*.46,(vh-152)*.707);
      var cw=Math.min(vw*.84,(vh-152)*.707);root.style.setProperty('--zc',Math.max(1,cw/W))}
    root.style.setProperty('--W',W+'px');
    if(lifted)lift(false,true);
  }
  addEventListener('resize',size);book.style.transition='none';size();
  requestAnimationFrame(function(){requestAnimationFrame(function(){book.style.transition=''})});

  function setOpen(o){
    isOpen=o;book.classList.toggle('closed',!o);book.classList.toggle('open',o);
    document.body.classList.toggle('is-open',o);
    if(!o){lift(false);stopMic();showCake(false)}
  }
  $('cover').onclick=$('openbtn').onclick=function(){setOpen(true)};
  $('cover').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(true)}};
  $('back').onclick=function(){setOpen(false)};
  // phone mode: one page at a time
  function showCake(on){
    book.classList.toggle('cake',on);document.body.classList.toggle('is-cake',on);
    if(on)lift(false);
    else if(document.body.classList.contains('single')){stopMic();manual=false;setNote('')}
  }
  $('nextbtn').onclick=function(){showCake(true)};
  $('prevbtn').onclick=function(){showCake(false)};
  var sx=null;
  addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',function(e){
    if(sx===null)return;var d=e.changedTouches[0].clientX-sx;sx=null;
    if(!isOpen||lifted||!document.body.classList.contains('single')||Math.abs(d)<60)return;
    showCake(d<0);
  });

  // letter lift
  function lift(on,instant){
    if(on===lifted&&!instant)return;
    if(!on){letter.style.transform='';letter.classList.remove('up');scrim.classList.remove('on');lifted=false;$('tuck').textContent='Tap the letter to read it';return}
    letter.style.transition=instant?'none':'';letter.style.transform='';
    var pr=left.getBoundingClientRect(),lr=letter.getBoundingClientRect();
    var narrow=innerWidth<760,tw,cx,cy=pr.top+pr.height/2;
    if(narrow){tw=Math.min(innerWidth*.92,(innerHeight-150)*1414/1200);cx=innerWidth/2}
    else{tw=pr.width*.86;cx=pr.left+pr.width/2}
    var s=tw/lr.width;
    letter.style.transform='translate('+(cx-(lr.left+lr.width/2))+'px,'+(cy-(lr.top+lr.height/2))+'px) scale('+s+')';
    letter.classList.add('up');scrim.classList.add('on');lifted=true;
    $('tuck').textContent='';
    if(instant)requestAnimationFrame(function(){letter.style.transition=''});
  }
  letter.onclick=function(){lift(!lifted)};
  letter.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();lift(!lifted)}};
  scrim.onclick=function(){lift(false)};

  // flames
  var fls=FL.map(function(f){
    var d=document.createElement('div');d.className='fl';
    d.style.cssText='left:'+f.x+'%;top:'+f.y+'%;width:'+f.w+'%';
    var im=document.createElement('img');im.src=f.src;im.alt='';d.appendChild(im);
    flamesEl.appendChild(d);return d;
  });
  var lit=true,bend=0,blowT=0,manual=false,micOn=false,an=null,ac=null,stream=null,buf=null,amb=.01,last=0,tt=0;
  function snuff(){
    if(!lit)return;lit=false;
    fls.forEach(function(d,i){
      d.style.transitionDelay=(i*70)+'ms';d.classList.add('out');
      var s=document.createElement('div');s.className='smoke';
      s.style.left=(parseFloat(d.style.left)+parseFloat(d.style.width)/2-3)+'%';
      s.style.top=(parseFloat(d.style.top)+ (FL[i].h)-2)+'%';
      s.style.animationDelay=(i*70)+'ms';flamesEl.appendChild(s);setTimeout(function(){s.remove()},1700);
    });
    wish.textContent='make a wish, '+NAME;wish.classList.add('show');bar.classList.add('done');confetti();
  }
  function relight(){
    lit=true;blowT=0;wish.classList.remove('show');bar.classList.remove('done');
    fls.forEach(function(d){d.style.transitionDelay='0ms';d.classList.remove('out')});
  }
  $('relight').onclick=relight;
  function confetti(){
    var cols=['#8d5bbd','#e2b542','#2f78b7','#c9402c','#5e8a6e','#f08a3c'];
    for(var i=0;i<80;i++){
      var c=document.createElement('i');c.className='conf';
      c.style.left=Math.random()*100+'vw';c.style.background=cols[i%6];
      c.style.animationDuration=(2.4+Math.random()*2.6)+'s';c.style.animationDelay=(Math.random()*.7)+'s';
      document.body.appendChild(c);setTimeout(c.remove.bind(c),6500);
    }
  }

  // mic
  function setNote(t){note.textContent=t}
  function stopMic(){
    micOn=false;if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    if(ac){try{ac.close()}catch(e){}ac=null}
    $('micbtn').textContent='Use microphone';
  }
  $('micbtn').onclick=function(){
    if(micOn){stopMic();setNote('Mic off');return}
    if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      setNote('The mic needs https. Host this file online, or use Hold to blow.');return}
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
      stream=s;ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();
      an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(s).connect(an);
      buf=new Float32Array(an.fftSize);amb=.01;micOn=true;
      $('micbtn').textContent='Mic on';setNote('Listening. Blow on your mic.');
    }).catch(function(){setNote('Mic blocked. Allow it in your browser, or use Hold to blow.')});
  };
  var hold=$('hold');
  function hd(v){return function(e){if(v)e.preventDefault();manual=v}}
  hold.addEventListener('pointerdown',hd(true));
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){hold.addEventListener(n,hd(false))});
  addEventListener('keydown',function(e){if(e.code==='Space'&&isOpen){e.preventDefault();manual=true}});
  addEventListener('keyup',function(e){if(e.code==='Space')manual=false});
  addEventListener('blur',function(){manual=false});

  (function tick(t){
    requestAnimationFrame(tick);
    var dt=last?Math.min((t-last)/1000,.1):0;last=t;tt+=dt;
    var rms=0,thr=.06;
    if(micOn&&an){
      an.getFloatTimeDomainData(buf);var s=0;for(var i=0;i<buf.length;i++)s+=buf[i]*buf[i];
      rms=Math.sqrt(s/buf.length);thr=Math.max(.06,amb*2.5+.03);
      if(rms<thr)amb+=(rms-amb)*.02;
    }
    var mic=rms>thr,inten=mic?Math.min(1,(rms-thr)/.12+.3):0;
    if(manual){mic=true;inten=1;rms=Math.max(rms,.14)}
    lvl.style.width=Math.min(100,rms*500)+'%';
    var target=(mic&&lit)?inten:0;
    bend+=(target-bend)*.18;
    if(lit){
      var b=bend*22+Math.sin(tt*18)*bend*3;
      fls.forEach(function(d){d.style.transform='rotate('+b+'deg) skewX('+(-b*.5)+'deg) scaleX('+(1-bend*.15)+')'});
      if(mic)blowT+=dt;else blowT=Math.max(0,blowT-dt*1.5);
      if(blowT>=.5)snuff();
    }
  })(0);
